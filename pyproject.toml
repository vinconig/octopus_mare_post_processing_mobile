[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-route-matcher"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pandas", "numpy", "shapely", "pyproj", "scipy", "gpxpy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
