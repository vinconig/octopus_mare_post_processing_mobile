[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gps-route-matcher"
version = "0.1.0"
requires-python = ">=3.11"
# Pinned exactly: the released files are reproduced byte for byte, and that depends on
# the numerical behaviour of these versions (Python 3.11).
dependencies = [
    "pandas==3.0.6",
    "numpy==2.4.6",
    "shapely==2.1.2",
    "pyproj==3.7.2",
    "scipy==1.17.1",
    "gpxpy==1.6.2",
    "geopandas==1.1.4",
    "osmnx==2.1.1",
    "networkx==3.6.1",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
